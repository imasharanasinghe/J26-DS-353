html, body { margin: 0; height: 100%; background: #F2F8FC; }
body { display: grid; place-items: center; overflow: hidden; }
.stage { container-type: inline-size; width: min(92vw, 960px); display: grid; place-items: center; }
.lockup { display: flex; align-items: center; }
.mark { width: 14.2cqw; height: auto; display: block; overflow: visible; }
.ring, .core { transform-box: view-box; transform-origin: 56px 60px; }
.end { transform-box: view-box; transform-origin: 94px 60px; }
.line { stroke-dasharray: 1; stroke-dashoffset: 0; }
.word { display: block; overflow: hidden; }
.wtext { display: inline-block; white-space: nowrap; padding-left: 2.2cqw; font-family: 'Outfit', system-ui, sans-serif; font-size: 7.5cqw; line-height: 1; letter-spacing: -0.02em; }
.wtext .c { font-weight: 500; color: #0A2540; }
.wtext .l { font-weight: 600; color: #1596CB; }
</style>
</head>
<body>
<div class="stage">
  <div class="lockup">
    <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="CartoLEARN logo mark">
      <g class="ring r1" fill="none" stroke="#0A2540" stroke-width="6.5" stroke-linecap="round"><path d="M91.2 30.4 A46 46 0 1 0 91.2 89.6"/></g>
      <g class="ring r2" fill="none" stroke="#135E8C" stroke-width="5.25" stroke-linecap="round"><path d="M79 40.7 A30 30 0 1 0 79 79.3"/></g>
      <g class="ring r3" fill="none" stroke="#1596CB" stroke-width="4" stroke-linecap="round"><path d="M66.7 51 A14 14 0 1 0 66.7 69"/></g>
      <path class="line" d="M56 60 H94" pathLength="1" fill="none" stroke="#1596CB" stroke-width="3" stroke-linecap="round"/>
      <circle class="core" cx="56" cy="60" r="5" fill="#0A2540"/>
      <circle class="end" cx="94" cy="60" r="6.5" fill="#1596CB"/>
    </svg>
    <div class="word"><div class="wtext"><span class="c">Carto</span><span class="l">LEARN</span></div></div>
  </div>
</div>

<script>
/*
  CartoLEARN loader
  - Rings turn while loading: outer and inner clockwise, middle counter-clockwise.
  - When loading completes, the line extends from the center, the end dot pops in,
    then the name slides in from left to right.
  Settings you may want to change:
*/
var SPIN = 3000;     // how long the rings turn (ms). Set this to your real loading time.
var LOOP = true;     // restart after a pause. Set to false to play once.
var HOLD = 2600;     // pause on the finished logo before restarting (ms)

(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var anims = [], timer = 0;
  var q = function (s) { return document.querySelector(s); };

  function rings(R) {
    return [
      { transform: 'rotate(0deg)', offset: 0, easing: 'linear' },
      { transform: 'rotate(' + (R * 0.78) + 'deg)', offset: 0.72, easing: 'cubic-bezier(.3,.5,.2,1)' },
      { transform: 'rotate(' + R + 'deg)', offset: 1 }
    ];
  }

  function add(node, kf, opt) {
    var a = node.animate(kf, Object.assign({ fill: 'both' }, opt));
    anims.push(a);
    return a;
  }

  function play() {
    clearTimeout(timer);
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    if (reduce) { return; }

    add(q('.r1'), rings(720), { duration: SPIN });
    add(q('.r2'), rings(-720), { duration: SPIN });
    add(q('.r3'), rings(720), { duration: SPIN });
    add(q('.core'), [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }],
      { duration: SPIN / 4, iterations: 4, easing: 'ease-in-out' });

    add(q('.line'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
      { duration: 700, delay: SPIN + 100, easing: 'cubic-bezier(.6,0,.2,1)' });
    add(q('.end'), [{ transform: 'scale(0)' }, { transform: 'scale(1.25)', offset: 0.65 }, { transform: 'scale(1)' }],
      { duration: 440, delay: SPIN + 660, easing: 'ease-out' });

    var W = q('.wtext').offsetWidth;
    var ease = 'cubic-bezier(.2,.8,.2,1)';
    add(q('.word'), [{ width: '0px' }, { width: W + 'px' }],
      { duration: 900, delay: SPIN + 1100, easing: ease });
    add(q('.wtext'), [{ transform: 'translateX(-2.6em)', opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }],
      { duration: 900, delay: SPIN + 1100, easing: ease });

    if (LOOP) { timer = setTimeout(play, SPIN + 1100 + 900 + HOLD); }
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(play, 250);
  });
  document.addEventListener('click', play);

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(play); } else { play(); }
})();
</script>
</body>
